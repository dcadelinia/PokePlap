version: '3.8' 

services:
pokeplap-core:
build:
context: .
dockerfile: Dockerfile
container_name: pokeplap_production_node
ports:
- "8000:8000"
environment:
- ENVIRONMENT=production
- LOG_LEVEL=info
restart: always
healthcheck:
test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
interval: 30s
timeout: 10s
retries: 3
