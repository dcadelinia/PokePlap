name: PokePlap Multi-Cloud Continuous Integration 

on:
push:
branches: [ "main" ]
pull_request:
branches: [ "main" ] 

permissions:
contents: read 

jobs:
test-and-verify:
runs-on: ubuntu-latest 

steps:

* name: Check out platform priority source distribution
uses: actions/checkout@v4
* name: Configure runtime environment matrix (Python 3.11)
uses: actions/setup-python@v5
with:
python-version: "3.11"
cache: 'pip'
* name: Resolve engineering dependency packages
run: |
python -m pip install --upgrade pip
if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
pip install pytest pytest-asyncio httpx websockets
* name: Execute asynchronous simulation and compliance verification test suite
run: |
pytest test_main.py -v
