app = "pokeplap"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  # Enforce multi-node timeline stickiness mapping boundaries
  [http_service.cookie_sticky_sessions]
    enabled = true
    cookie_name = "pokeplap_matrix_session"
    ttl = "3600s"

[[statics]]
  guest_path = "/app/index.html"
  url_prefix ="/"
